# An `AppStorage` over Room and the bundled SQLite. The only module that knows a database exists; it knows
# nothing about BJJ: every row is a document, as in the web app's IndexedDB.
description: "Storage engine: AppStorage over Room"
product:
  type: kmp/lib
  platforms: [android, jvm]

apply:
  - //templates/tested-lib.module-template.yaml
  - //templates/room-lib.module-template.yaml

dependencies:
  - //libs/core: exported

settings:
  kotlin:
    ksp:
      processors:
        - $libs.androidx.room.compiler
      processorOptions:
        room.schemaLocation: ./schemas
