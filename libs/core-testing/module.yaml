# What tests share. The toolchain has no test fixtures (a module's tests can't see another's `test/`), so this
# is an ordinary library that modules list under `test-dependencies`: the storage contract every engine must
# pass, `testCore()` (in-memory storage, a clock the test controls, predictable ids) and the entity builders.
description: "Test helpers: the storage contract, testCore, fixtures"
product:
  type: kmp/lib
  platforms: [android, jvm]

apply:
  - //templates/lib.module-template.yaml

dependencies:
  - //libs/core: exported
  - $kotlin.test: exported
  - $libs.kotlinx.coroutines.test: exported

# `kotlin.test.BeforeTest` on the JVM and Android is JUnit's annotation, which only the JUnit flavour carries.
dependencies@android:
  - $kotlin.test.junit5: exported

dependencies@jvm:
  - $kotlin.test.junit5: exported
