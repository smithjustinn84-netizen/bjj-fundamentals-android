// What the Compose compiler may take as stable though it never compiled it: `core` has no Compose, so without
// this every type of its, and every List, is compared by instance, and a screen handed a list rebuilt with the
// same contents recomposes all the same. Listed, a parameter is compared by equals and skips.
// Each entry must stay immutable: no public var, no mutable collection or array held, no open class or interface
// whose implementations could be. Passed by `stabilityConfigurationPath` in every module that enables Compose.

// Read-only collections and ranges. Nothing in the app hands a mutable one to state and changes it after.
kotlin.collections.*
kotlin.ranges.IntRange

// The app's models and what its pure functions return.
dev.justinsmith.bjj.core.*
