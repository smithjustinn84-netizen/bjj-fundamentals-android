# Keeps the workflow's pinned actions current (it rewrites the SHA and the version comment together). Libraries are not covered: Dependabot has no
# Kotlin Toolchain (Amper) ecosystem, so libs.versions.toml is bumped by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release has to be a week old first, so one that is pulled or found bad never reaches us.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
